name: BuildFolio CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    # Setup Node.js
    - name: Setup Node.js 22
      uses: actions/setup-node@v3
      with:
        node-version: '22'
        cache: 'npm'

    # Next.js Frontend checks
    - name: Install Frontend Dependencies
      run: npm ci
      
    - name: Lint Frontend
      run: npm run lint
      
    - name: Build Frontend
      run: npm run build

    # NestJS Backend checks
    - name: Install Backend Dependencies
      run: npm ci
      working-directory: ./backend

    - name: Build Backend
      run: npm run build
      working-directory: ./backend

  docker-check:
    runs-on: ubuntu-latest
    needs: lint-and-build
    steps:
    - uses: actions/checkout@v3

    - name: Build Frontend Docker Image
      run: docker build -t buildfolio-frontend -f Dockerfile .
      
    - name: Build Backend Docker Image
      run: docker build -t buildfolio-backend -f backend/Dockerfile ./backend
