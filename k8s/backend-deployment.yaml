apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: buildfolio-backend:latest
        imagePullPolicy: Never # Use local image for Minikube
        ports:
        - containerPort: 4000
        envFrom:
        - configMapRef:
            name: buildfolio-config
        - secretRef:
            name: buildfolio-secret
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 4000
      targetPort: 4000
